<!DOCTYPE html>

<body>
    <script>

        function playRound(playerSelection, computerSelection){
            if(playerSelection == 'rock'){
                if(computerSelection == 'rock'){
                    return ('Draw!')
                }else if(computerSelection == 'papper'){
                    return('You loose, Computer choosed: ' + computerSelection)
                }else if(computerSelection == 'scissors'){
                    return ('You won! Computer choosed: ' + computerSelection)
                }
            }else if(playerSelection == 'papper'){
                if(computerSelection == 'papper'){
                    return ('Draw!')
                }else if(computerSelection == 'scissors'){
                    return('You loose, Computer choosed: ' + computerSelection)
                }else if(computerSelection == 'rock'){
                    return ('You won! Computer choosed: ' + computerSelection)
                }
            }else if(playerSelection == 'scissors'){
                if(computerSelection == 'scissors'){
                    return ('Draw!')
                }else if(computerSelection == 'rock'){
                    return('You loose, Computer choosed: ' + computerSelection)
                }else if(computerSelection == 'papper'){
                    return ('You won! Computer choosed: ' + computerSelection)
                }
            }else{
                return('Not a valid value')
            }
        }

        function computerPlay(){
            let randomChoice = Math.trunc(Math.random() * 3) + 1
            //console.log(randomChoice)
            switch(randomChoice){
                case 1:
                    return 'rock'
                break
                case 2:
                    return 'papper'
                break
                case 3:
                    return 'scissors'
                break
            }
        }

        function game(){
            let games = 5
            for(let i = 1; i <= 5; i++){
                let playerSelection = prompt("Select your move").toLowerCase()
                //let playerSelection = 'rock'
                let computerSelection = computerPlay()
                //console.log(computerSelection)
                console.log(playRound(playerSelection, computerSelection))
                console.log('Game number ' + i)
            }
        }

        game()
    </script>
