<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">

        <div id="scoreCotainer">
            <p id="player-choice">You:</p>
            <p id="player-score">Score: 0</p>
            <p id="computer-choice">Computer:</p>
            <p id="computer-score">Score: 0</p>
        </div>

        
        <div id="buttons">
            <button id="rock">Rock</button>
            <button id="papper">Papper</button>
            <button id="scissors">Scissor</button>
        </div>

        <div id="Round-score-board">
            <p id="total-rounds"></p>
            <p id="final-score"></p>
        </div>
    </div>
    <script src="script.js">
        
    </script>
</body>
</html>
